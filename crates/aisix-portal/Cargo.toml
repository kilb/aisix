[package]
name = "aisix-portal"
version = "0.1.0"
edition = "2021"

# 与 crates/aisix-console 一样自带版本，不进 workspace deps：
# 门户是独立进程，它的依赖不该压到网关那些 crate 头上。
[dependencies]
# 用网关自己的 id 派生函数，不复制那段逻辑：api_key_id 是 uuid5(命名空间,
# "api_keys/<display_name>")，自己抄一份必然跟上游漂开，而漂开的后果是门户
# 按错的 id 过滤日志、用户看到空白且不知道为什么。
aisix-core = { path = "../aisix-core" }
argon2 = "0.5.3"
# rand_core 0.6 与 argon2 依赖的是同一个版本 —— 与 crates/aisix-console 一致，
# 口令盐和（后续的）会话 token 共用一套随机源，省掉两套版本对齐。
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 选 sqlx 而非 rusqlite：异步，与 axum/tokio 一致，不必 spawn_blocking；
# 换 Postgres 只需改 feature 与连接串（spec §8 把多实例门户列为未定）。
# 用运行时查询而不是编译期宏，避免构建时依赖 DATABASE_URL。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 测试起真监听、发真 HTTP —— 与 crates/aisix-console 的做法一致，不用 mock。
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
