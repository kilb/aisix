name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual escape hatch: GitHub intermittently fails to materialize
  # pull_request-triggered runs for a branch (observed on #936 — the
  # synchronize/opened events produced no check suite while every other
  # branch's did). Dispatching on the PR ref attaches the same check
  # runs to the head commit.
  workflow_dispatch:

# A newer push to a pull request cancels that PR's in-flight run. Every other
# run gets a group of its own (keyed on the run id), so a push to main is never
# cancelled and never superseded while it waits for a slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check guardrails without provider features
        run: cargo check --locked -p aisix-guardrails --no-default-features

  security-audit:
    name: dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: reject known dependency vulnerabilities
        run: cargo audit

  schema-drift:
    name: schema drift (resources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: regenerate schemas
        run: |
          # The dump only ever writes, so a file it STOPPED emitting (a
          # resource dropped from RESOURCES) would sit in the tree forever and
          # keep being vendored. Clear both sets first so a vanished file shows
          # up in `git diff` as a deletion.
          rm -f schemas/resources/*.schema.json schemas/resources-lenient/*.schema.json
          cargo run -p aisix-core --bin dump-schema
      - name: assert no drift
        run: |
          # --intent-to-add so a file the dump newly creates (a new resource,
          # or a whole set) shows up in `git diff` instead of passing as
          # untracked. Both published sets are checked: `schemas/resources/`
          # (strict write contract) and `schemas/resources-lenient/` (the
          # etcd loader's read contract).
          git add --intent-to-add schemas/
          if ! git diff --exit-code schemas/; then
            echo "::error::Resource JSON Schemas in 'schemas/resources/' or 'schemas/resources-lenient/' drift from the Rust types in 'crates/aisix-core/src/models/'."
            echo "::error::Fix: run 'cargo run -p aisix-core --bin dump-schema' locally and commit the diff."
            exit 1
          fi

  openapi-generate:
    name: generate admin openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: generate Admin API OpenAPI
        run: |
          cargo run -p aisix-admin --bin dump-openapi > /tmp/admin-api.openapi.json
      - name: validate generated OpenAPI
        run: |
          python3 - <<'PY'
          import json

          with open("/tmp/admin-api.openapi.json") as f:
              spec = json.load(f)

          assert spec["openapi"].startswith("3.")
          assert spec["info"]["title"] == "AISIX OSS Admin API"
          assert spec["info"]["version"] == "dev"
          assert "/admin/v1/models" in spec["paths"]
          assert "Model" in spec["components"]["schemas"]
          PY

  rust-unit:
    name: rust unit + coverage
    runs-on: ubuntu-latest
    services:
      redis:
        # The Redis Stack image bundles the FT.* vector-search commands the
        # semantic-cache tests probe. The plain redis image does not expose
        # those commands, even at version 8, and would silently skip them.
        image: redis/redis-stack-server:7.4.0-v8
        ports: ["6379:6379"]
      # Real etcd for crates/aisix-admin/tests/etcd_integration.rs —
      # exercises the full Admin handler → EtcdConfigStore →
      # aisix-etcd::loader round-trip so regressions in subkey
      # constants or KV serde shape get caught here, not at runtime.
      #
      # ghcr.io/api7/etcd tags are copies of quay.io/coreos/etcd; add a
      # new tag with `docker buildx imagetools create --tag
      # ghcr.io/api7/etcd:<tag> quay.io/coreos/etcd:<tag>` before
      # referencing it. The image honours `ETCD_*` env vars directly,
      # so no command override is needed.
      etcd:
        image: ghcr.io/api7/etcd:v3.5.18
        ports: ["2379:2379"]
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      # The control plane's database, for crates/aisix-control-plane's
      # tests (each test clones its own database from a migrated
      # template), and kine's, created by the "Start kine" step below.
      # The digest is the multi-platform index Docker Hub served for
      # `postgres:18` on 2026-11-05 (PostgreSQL 18.6); bump both together.
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      # Picked up by crates/aisix-control-plane/tests (support/mod.rs).
      # Unset locally they skip; unset on CI they fail. CP_TEST_KINE_BIN is
      # set by the "Start kine" step, since a job-level env cannot read the
      # runner context. Same no-AISIX_-prefix rule as below.
      CP_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CP_TEST_KINE_ENDPOINT: http://127.0.0.1:2389
      # Picked up by crates/aisix-cache/tests/redis_integration.rs.
      # The tests no-op when this is unset (local dev), so absence is safe.
      #
      # MUST NOT start with the `AISIX_` prefix — Config::load_from_path
      # owns that namespace (config-rs Environment::with_prefix("AISIX")).
      # An AISIX_CACHE_* name reaches `Config` as an override of the cache
      # section and breaks every Config::load_from_path test; any other
      # AISIX_ name is dropped with a warning on every boot.
      CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379
      # Picked up by crates/aisix-cache/tests/semantic_redis_integration.rs
      # — needs the vector-capable redis:8 service above. The PLAIN url
      # points at a cluster node (redis:7, no vector search) to pin the
      # capability probe's failure path. Same skip-if-unset /
      # no-AISIX_-prefix rules.
      CACHE_TEST_REDIS_VECTOR_URL: redis://127.0.0.1:6379
      CACHE_TEST_REDIS_PLAIN_URL: redis://127.0.0.1:7000
      # Picked up by crates/aisix-ratelimit/tests/redis_integration.rs
      # (shared cluster-level counters, #798). Same skip-if-unset /
      # no-AISIX_-prefix rules as CACHE_TEST_REDIS_URL above.
      RATELIMIT_TEST_REDIS_URL: redis://127.0.0.1:6379
      # Redis Cluster + Sentinel topologies started by the "Start Redis
      # Cluster + Sentinel" step below — exercise the `mode: cluster` /
      # `mode: sentinel` connection paths in both cache + ratelimit
      # integration tests. Same skip-if-unset / no-AISIX_-prefix rules.
      RATELIMIT_TEST_REDIS_CLUSTER_NODES: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
      RATELIMIT_TEST_REDIS_SENTINELS: redis://127.0.0.1:26379
      RATELIMIT_TEST_REDIS_MASTER: mymaster
      CACHE_TEST_REDIS_CLUSTER_NODES: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
      CACHE_TEST_REDIS_SENTINELS: redis://127.0.0.1:26379
      CACHE_TEST_REDIS_MASTER: mymaster
      # Picked up by crates/aisix-redis/tests/auth_connect.rs. A
      # password-protected Redis of its own (6390), started by the step
      # below: `requirepass` is server-wide, so putting it on the shared
      # service would lock every other Redis test out of it. The URL
      # carries NO credential — the tests supply it, in each of the ways
      # an operator can. Same skip-if-unset / no-AISIX_-prefix rules.
      REDIS_AUTH_TEST_URL: redis://127.0.0.1:6390
      REDIS_AUTH_TEST_PASSWORD: aisix-ci-redis
      # The cluster and sentinel halves of the same file, pointed at the
      # topologies below. They need NO password, which is what makes them
      # usable here: a credential they refuse proves the field reached
      # the handshake, without a second authenticated topology.
      REDIS_AUTH_TEST_CLUSTER_NODES: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002
      REDIS_AUTH_TEST_SENTINELS: redis://127.0.0.1:26379
      REDIS_AUTH_TEST_MASTER: mymaster
      # Picked up by crates/aisix-redis/tests/sentinel_failover.rs — the
      # master+replica+sentinel(26380) topology the setup step brings up,
      # so the failover/reconnect test forces a real promotion in CI.
      REDIS_FAILOVER_SENTINELS: redis://127.0.0.1:26380
      REDIS_FAILOVER_MASTER: myfo
      # Picked up by crates/aisix-admin/tests/etcd_integration.rs.
      # Same skip-if-unset pattern as the Redis case above.
      ADMIN_TEST_ETCD_URL: http://127.0.0.1:2379
      # Picked up by crates/aisix-etcd/tests/watch_integration.rs.
      ETCD_TEST_URL: http://127.0.0.1:2379
      # Picked up by crates/aisix-etcd/tests/auth_connect_integration.rs.
      # A SECOND cluster, started with authentication ON by the step
      # below: enabling auth is cluster-wide, so doing it on the service
      # above would lock every other etcd test out of it. Same
      # skip-if-unset / no-AISIX_-prefix rules.
      ETCD_AUTH_TEST_URL: http://127.0.0.1:2479
      ETCD_AUTH_TEST_USER: root
      ETCD_AUTH_TEST_PASSWORD: aisix-ci-etcd
      # Picked up by crates/aisix-etcd/tests/auth_token_recovery.rs and
      # crates/aisix-admin/tests/etcd_integration.rs. A THIRD cluster,
      # authenticated like the one above but differing in two ways that
      # the token-recovery tests need and that no other test should have
      # to live with: its tokens expire in seconds instead of the
      # five-minute default, so a test can sit out a real expiry; and it
      # runs `--auth-token jwt` instead of the default `simple`, which is
      # the only mode in which an auth-store revision change refuses a
      # token that was already issued. Tests here also change that auth
      # store, which stales every token the cluster has handed out. The
      # container and this short-lifetime approach come from community PR
      # api7/aisix#763 (okaybase). `ETCD_AUTH_TTL_TEST_SECS` must match
      # the `ttl=` below — the tests sleep past it.
      ETCD_AUTH_TTL_TEST_URL: http://127.0.0.1:2579
      ETCD_AUTH_TTL_TEST_USER: root
      ETCD_AUTH_TTL_TEST_PASSWORD: aisix-ci-etcd
      ETCD_AUTH_TTL_TEST_SECS: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Start the authenticated etcds
        # Not service containers: a user has to be created and
        # `auth enable` called after the server is up, which service
        # containers cannot do.
        #
        # Two of them, on 2479 and 2579. The second issues JWT tokens
        # with a lifetime short enough for a test to sit out a real
        # expiry. It is a cluster of its own so that neither that
        # lifetime, nor the auth-store changes those tests make, can
        # reach the first.
        run: |
          # Signing key for the JWT cluster below. Generated per run and
          # thrown away with the runner: it authenticates nothing outside
          # this job.
          mkdir -p /tmp/etcd-jwt
          openssl genpkey -algorithm RSA -out /tmp/etcd-jwt/jwt.key -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in /tmp/etcd-jwt/jwt.key -pubout -out /tmp/etcd-jwt/jwt.pub
          start_auth_etcd() {
            name=$1
            client=$2
            peer=$3
            shift 3
            docker run -d --name "$name" -p "$client:$client" -v /tmp/etcd-jwt:/keys \
              ghcr.io/api7/etcd:v3.5.18 \
              /usr/local/bin/etcd --name "$name" "$@" \
              --listen-client-urls "http://0.0.0.0:$client" \
              --advertise-client-urls "http://127.0.0.1:$client" \
              --listen-peer-urls "http://0.0.0.0:$peer" \
              --initial-advertise-peer-urls "http://127.0.0.1:$peer" \
              --initial-cluster "$name=http://127.0.0.1:$peer"
            etcdctl() {
              docker exec -e ETCDCTL_API=3 -e ETCDCTL_ENDPOINTS="http://127.0.0.1:$client" \
                "$name" etcdctl "$@"
            }
            for _ in $(seq 30); do
              etcdctl endpoint health && break
              sleep 1
            done
            # Fail here rather than let the three `etcdctl` calls below
            # fail one at a time with a connection error that says
            # nothing about which cluster never came up.
            etcdctl endpoint health \
              || { echo "::error::$name never became ready on $client"; exit 1; }
            etcdctl user add root:aisix-ci-etcd
            etcdctl user grant-role root root
            etcdctl auth enable
          }
          start_auth_etcd etcd-auth 2479 2480
          # Keep `ttl=` in step with ETCD_AUTH_TTL_TEST_SECS above.
          start_auth_etcd etcd-auth-ttl 2579 2580 \
            --auth-token 'jwt,pub-key=/keys/jwt.pub,priv-key=/keys/jwt.key,sign-method=RS256,ttl=5s'
      - name: Start Redis Cluster + Sentinel
        # The `redis` service above covers single-node. Here we bring up a
        # 3-node cluster (7000-7002) and a sentinel (26379) monitoring the
        # 6379 service as `mymaster`, so the cache + ratelimit integration
        # tests exercise the cluster/sentinel connection modes. Host
        # networking + announce-ip keep the advertised addresses reachable
        # from the test process.
        run: |
          for p in 7000 7001 7002; do
            docker run -d --name rediscl-$p --network host redis:7-alpine \
              redis-server --port $p --cluster-enabled yes --cluster-config-file nodes.conf \
              --cluster-node-timeout 5000 --cluster-announce-ip 127.0.0.1 --appendonly no
          done
          sleep 2
          docker exec rediscl-7000 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
          for i in $(seq 1 30); do
            state=$(docker exec rediscl-7000 redis-cli -p 7000 cluster info | tr -d '\r' | grep -oP 'cluster_state:\K\w+')
            [ "$state" = "ok" ] && break
            sleep 1
          done
          # Fail fast if the cluster never formed, instead of letting the
          # integration tests surface it later as confusing connection errors.
          [ "$state" = "ok" ] || { echo "::error::Redis cluster did not become ready"; exit 1; }
          printf 'port 26379\nsentinel monitor mymaster 127.0.0.1 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\n' > /tmp/sentinel.conf
          docker run -d --name redis-sentinel --network host -v /tmp/sentinel.conf:/data/sentinel.conf \
            redis:7-alpine redis-sentinel /data/sentinel.conf
          sleep 2
          # get-master-addr-by-name prints host and port on separate lines;
          # join them so the IP+port match isn't defeated by grep's per-line
          # matching.
          docker exec redis-sentinel redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | tr -d '\r' | tr '\n' ' ' | grep -qE '127\.0\.0\.1 +6379' \
            || { echo "::error::Sentinel 26379 did not resolve mymaster"; exit 1; }
          # Failover topology: master (6381) + replica (6382) + sentinel
          # (26380) monitoring `myfo`, so the failover/reconnect test can
          # force a real promotion. The sentinel conf dir is mounted (not a
          # single file) so sentinel can rewrite it on failover.
          docker run -d --name redis-fo-master --network host redis:7-alpine redis-server --port 6381
          docker run -d --name redis-fo-replica --network host redis:7-alpine \
            redis-server --port 6382 --replicaof 127.0.0.1 6381 --replica-announce-ip 127.0.0.1
          sleep 2
          mkdir -p /tmp/sentinel-fo
          printf 'port 26380\nsentinel monitor myfo 127.0.0.1 6381 1\nsentinel down-after-milliseconds myfo 5000\nsentinel failover-timeout myfo 10000\nsentinel parallel-syncs myfo 1\n' > /tmp/sentinel-fo/sentinel.conf
          docker run -d --name redis-fo-sentinel --network host -v /tmp/sentinel-fo:/data \
            redis:7-alpine redis-sentinel /data/sentinel.conf
          sleep 2
          docker exec redis-fo-sentinel redis-cli -p 26380 sentinel get-master-addr-by-name myfo | tr -d '\r' | tr '\n' ' ' | grep -qE '127\.0\.0\.1 +6381' \
            || { echo "::error::Failover sentinel 26380 did not resolve myfo to the master"; exit 1; }
          # A password-protected Redis for the credential-refusal tests.
          # Its own server because `requirepass` is server-wide.
          docker run -d --name redis-auth --network host redis:7-alpine \
            redis-server --port 6390 --requirepass aisix-ci-redis
          for _ in $(seq 30); do
            docker exec redis-auth redis-cli -p 6390 -a aisix-ci-redis ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec redis-auth redis-cli -p 6390 -a aisix-ci-redis ping | grep -q PONG \
            || { echo "::error::Authenticated Redis 6390 did not come up"; exit 1; }
      - name: Start kine for the control-plane tests
        # The pinned binary, refused by scripts/fetch-kine.sh unless its
        # sha256 matches, on a database of its own in the postgres service.
        # Port 2389, because the etcd service holds 2379. No metrics
        # listener: by default it binds every interface.
        run: |
          scripts/fetch-kine.sh "$RUNNER_TEMP/kine"
          echo "CP_TEST_KINE_BIN=$RUNNER_TEMP/kine" >> "$GITHUB_ENV"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c 'CREATE DATABASE kine_ci'
          nohup "$RUNNER_TEMP/kine" \
            --endpoint "postgres://postgres:postgres@127.0.0.1:5432/kine_ci?sslmode=disable" \
            --listen-address 127.0.0.1:2389 \
            --metrics-bind-address 0 \
            >"$RUNNER_TEMP/kine.log" 2>&1 &
          for _ in $(seq 30); do
            (exec 3<>/dev/tcp/127.0.0.1/2389) 2>/dev/null && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/2389) 2>/dev/null || {
            cat "$RUNNER_TEMP/kine.log"
            echo "::error::kine never listened on 127.0.0.1:2389"
            exit 1
          }
      - name: unit tests with coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov-unit.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: lcov-unit.info
          retention-days: 7
      - name: exporter User-Agent uses the release version
        env:
          # Differ from Cargo's version so the old source cannot pass.
          AISIX_BUILD_VERSION: 0.0.0-ci
        run: cargo test -p aisix-obs --lib otlp_http_sink::tests::otlp_sink_posts_one_request_with_all_spans -- --exact

  build-bin:
    name: build aisix (instrumented)
    runs-on: ubuntu-latest
    env:
      AISIX_BUILD_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: build coverage-instrumented binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
        run: |
          # cargo-llvm-cov's official external-test flow supplies all required
          # instrumentation flags, not just `-C instrument-coverage`.
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo build -p aisix-server --bin aisix
      - uses: actions/upload-artifact@v7
        with:
          name: aisix-bin
          path: target/llvm-cov-target/debug/aisix
          # 72 MB binary × many runs will refill the quota quickly;
          # keep only as long as the downstream e2e job needs it.
          retention-days: 1

  e2e:
    name: e2e (vitest, ${{ matrix.serving }}, ${{ matrix.shard }}/${{ matrix.shard_total }}) + coverage
    needs: [build-bin]
    runs-on: ubuntu-latest
    # Explicit, so the job's token stays read-only regardless of the
    # repository-level default (currently `read`, but that is a setting).
    # Mirrors the mcp-conformance job below.
    permissions:
      contents: read
    strategy:
      # The two serving modes are separate products of the same binary:
      # thread-per-core answers a request on the thread that accepted it
      # and dispatches on that thread's own upstream pool, work-stealing
      # shares one runtime and one pool. A failure in one says nothing
      # about the other, so neither leg cancels the other.
      fail-fast: false
      matrix:
        serving: [thread-per-core, work-stealing]
        # Each serving mode's suite is split across four jobs with
        # `vitest --shard`; every shard keeps the full per-job setup below
        # (four etcds, four forks). `shard_total` must equal the length of
        # `shard`, or part of the suite runs in no job.
        shard: [1, 2, 3, 4]
        shard_total: [4]
        include:
          # The Linux default, and so the one production runs.
          - serving: thread-per-core
            thread_per_core: "true"
          # The documented fallback. Kept green so it stays a real
          # option when a deployment needs it.
          - serving: work-stealing
            thread_per_core: "false"
    services:
      # One etcd per vitest fork. The suite ran at two forks because
      # 20+ files' gateways watching a SINGLE cluster pushed watch
      # dispatch past `waitConfigPropagation` (#157); the fork count is
      # derived from AISIX_E2E_ETCD_ENDPOINTS below, so removing a
      # cluster here lowers it rather than doubling forks onto a shared
      # one. It does NOT work in the other direction: forkBudget is also
      # capped by the core count, and ubuntu-latest has exactly four — a
      # fifth service would add no forks and only a fifth thing that has
      # to be up. Raising concurrency means a bigger runner AND another
      # cluster, in that order.
      etcd:
        image: ghcr.io/api7/etcd:v3.5.15
        env:
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
        ports: ["2379:2379"]
      etcd2:
        image: ghcr.io/api7/etcd:v3.5.15
        env:
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
        ports: ["2380:2379"]
      etcd3:
        image: ghcr.io/api7/etcd:v3.5.15
        env:
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
        ports: ["2381:2379"]
      etcd4:
        image: ghcr.io/api7/etcd:v3.5.15
        env:
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
        ports: ["2382:2379"]
      redis:
        # Redis Stack is vector-capable, so the semantic-cache redis e2e
        # exercises the real FT.* path against AISIX_E2E_REDIS.
        image: redis/redis-stack-server:7.4.0-v8
        ports: ["6379:6379"]
      redis-plain:
        # A vector-LESS redis so the semantic-cache degradation suite
        # (exact-only on plain redis) actually runs in CI instead of
        # skipping forever now that the main service is redis:8.
        image: redis:7-alpine
        ports: ["6377:6379"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: aisix-bin
          path: target/debug
      - run: chmod +x target/debug/aisix
      - uses: actions/setup-node@v6
        with:
          # pnpm 11 requires Node 22.13 or newer — it imports `node:sqlite`
          # for its store index. The job only passes on Node 20 because it
          # happens not to reach that code path; any pnpm command that
          # touches the store (a cache step, `pnpm store path`) fails with
          # ERR_UNKNOWN_BUILTIN_MODULE. GitHub is also deprecating Node 20
          # on its runners.
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          # CI pins pnpm 11 (lockfile format v9); generate
          # tests/e2e/pnpm-lock.yaml with a pnpm that keeps that format.
          version: 11
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The e2e suite executes a coverage-instrumented Rust binary. These
          # matching LLVM tools turn its profraw counters into LCOV.
          components: llvm-tools-preview
      - name: require the e2e harness
        # pnpm exits 0 in a directory that has pnpm-workspace.yaml but no
        # package.json, so a missing harness must be caught here.
        run: |
          if [ ! -f tests/e2e/package.json ]; then
            echo "::error::tests/e2e/package.json is missing"
            exit 1
          fi
      - name: e2e install
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile
      # vitest strips types without checking them, so a type error in a
      # case (e.g. a `test.each` callback expecting a context vitest never
      # passes) would otherwise only surface when that branch runs.
      - name: e2e typecheck
        working-directory: tests/e2e
        run: pnpm exec tsc --noEmit
      - name: run e2e
        working-directory: tests/e2e
        # Read by the harness, which writes it into every spawned
        # gateway's `proxy.thread_per_core`. The binary's own default is
        # platform-derived, so without this both legs would run the same
        # mode and the second would prove nothing.
        env:
          E2E_THREAD_PER_CORE: ${{ matrix.thread_per_core }}
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage/aisix-${{ matrix.serving }}-%p-%m.profraw
          # Vector-less redis for the semantic-cache degradation suite;
          # the main 6379 service is redis:8 (vector-capable).
          AISIX_E2E_REDIS_PLAIN: redis://127.0.0.1:6377
          # One entry per etcd service above. vitest derives maxWorkers
          # from this list (see tests/e2e/vitest.config.ts), and
          # harness/etcd.ts hands each fork its own entry.
          AISIX_E2E_ETCD_ENDPOINTS: http://127.0.0.1:2379,http://127.0.0.1:2380,http://127.0.0.1:2381,http://127.0.0.1:2382
        run: |
          # LLVM creates the profile file, but not its parent directory.
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          pnpm test --shard=${{ matrix.shard }}/${{ matrix.shard_total }}
      - name: export Rust e2e coverage
        # The gate downloads every leg with `merge-multiple: true`, which
        # flattens same-named files to one — the legs must upload distinct
        # filenames or only one leg's coverage survives the merge.
        if: always()
        run: |
          shopt -s nullglob
          profiles=(coverage/aisix-${{ matrix.serving }}-*.profraw)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "::error::The e2e binary emitted no LLVM coverage profiles"
            exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          if ! "$llvm_bin/llvm-profdata" merge -sparse "${profiles[@]}" \
            -o "coverage/aisix-${{ matrix.serving }}.profdata"; then
            # One profile it cannot read fails the merge. Name each one, and
            # the test whose gateway wrote it: the harness records which
            # test spawned each pid, and the profile is named by pid. A
            # profile cut short means that gateway was killed while it wrote
            # it, at exit.
            for p in "${profiles[@]}"; do
              "$llvm_bin/llvm-profdata" show "$p" > /dev/null 2>&1 && continue
              pid=$(basename "$p" | sed -E 's/^aisix-${{ matrix.serving }}-([0-9]+)-.*/\1/')
              owner=$(awk -F'\t' -v pid="$pid" '$1 == pid { print $2 " > " $3 }' \
                coverage/aisix-pids.tsv 2>/dev/null | tail -1)
              echo "::error::unreadable coverage profile $p, from gateway pid $pid: ${owner:-not spawned through the harness}"
            done
            exit 1
          fi
          "$llvm_bin/llvm-cov" export --format=lcov \
            --instr-profile="coverage/aisix-${{ matrix.serving }}.profdata" \
            --ignore-filename-regex='/(\.cargo/(registry|git)|rustc|target|tests)/' \
            target/debug/aisix \
            > "coverage/lcov-${{ matrix.serving }}-${{ matrix.shard }}.info"
          test -s "coverage/lcov-${{ matrix.serving }}-${{ matrix.shard }}.info" || {
            echo "::error::LLVM exported an empty e2e coverage report"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Per leg: two uploads under one name is a hard conflict the
          # moment the suite starts emitting coverage.
          name: coverage-e2e-${{ matrix.serving }}-${{ matrix.shard }}
          path: coverage/lcov-${{ matrix.serving }}-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 7

  # The cross-plane suite (tests/e2e/src/cp-cases, vitest.cp.config.ts): a
  # real gateway in managed mode, booted from the credential bundle, against
  # the real control plane, kine and Postgres (scripts/cp-dev-stack.mjs). Its
  # own job because it needs Postgres and kine and no etcd, and because it
  # builds the control plane, which `build-bin` does not. It uploads no
  # coverage artifact: the coverage gate expects exactly the eight
  # `coverage-e2e-*` artifacts of the `e2e` matrix.
  e2e-cp:
    name: e2e control plane (vitest, ${{ matrix.serving }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Both serving modes, as the `e2e` matrix runs them: every spawn site
      # reads E2E_THREAD_PER_CORE, and a leg that never ran the other mode
      # would prove nothing about it.
      fail-fast: false
      matrix:
        include:
          - serving: thread-per-core
            thread_per_core: "true"
          - serving: work-stealing
            thread_per_core: "false"
    services:
      # The same image and digest as rust-unit's control-plane database.
      # Each stack creates and drops two databases of its own on it.
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The control plane's build.rs generates the etcd front from protos.
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          # Same as the e2e job: pnpm 11 needs Node 22.13 or newer.
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: fetch kine
        # The pinned binary, refused by scripts/fetch-kine.sh unless its
        # sha256 matches. Each stack starts its own kine on it.
        run: |
          scripts/fetch-kine.sh "$RUNNER_TEMP/kine"
          echo "CP_E2E_KINE_BIN=$RUNNER_TEMP/kine" >> "$GITHUB_ENV"
      - name: require psql
        # cp-dev-stack.mjs creates and drops its databases with the runner's
        # psql client.
        run: psql --version
      - name: build the gateway and the control plane
        # Each binary named: `--bin` filters every selected package, so
        # `-p aisix-server --bin aisix -p aisix-control-plane` alone builds
        # no control-plane binary.
        run: cargo build -p aisix-server --bin aisix -p aisix-control-plane --bin aisix-control-plane
      - name: e2e install
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile
      - name: e2e typecheck
        working-directory: tests/e2e
        run: pnpm exec tsc --noEmit
      - name: run the cross-plane e2e
        working-directory: tests/e2e
        env:
          CP_E2E_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          E2E_THREAD_PER_CORE: ${{ matrix.thread_per_core }}
        run: pnpm exec vitest run -c vitest.cp.config.ts

  # `vitest` and `vite` transpile without typechecking, so a genuine type
  # error — a helper called with the wrong argument shape, a renamed field
  # still referenced — never fails a run. It just sits in the tree. Nothing
  # in this workflow ran `tsc`, and one had accumulated in the e2e harness.
  typecheck:
    name: typecheck (ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          # Same version as the e2e jobs: see the note on `version` there.
          version: 11
      - name: tsc --noEmit
        run: |
          # tests/e2e locks with pnpm, so `npm ci` cannot install it. It installs
          # the way the jobs that run it do, so the types are checked against
          # the dependencies those jobs execute.
          echo "::group::tests/e2e"
          (cd tests/e2e && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit)
          echo "::endgroup::"
          for d in web web-portal web-cp; do
            echo "::group::$d"
            (cd "$d" && npm ci --no-audit --no-fund && npx tsc --noEmit)
            echo "::endgroup::"
          done

  e2e-gate:
    # `main` requires the status check named literally `e2e (vitest) +
    # coverage`. The matrix above publishes one check per leg instead, so
    # that exact context never arrives and the PR sits forever at
    # "Expected — Waiting for status to be reported" with every leg green.
    # This job republishes the required name over the matrix's aggregate
    # result, which keeps the branch-protection setting untouched — the
    # other open PRs still report the old name and would all break the
    # moment the required contexts were renamed to the two leg names.
    name: e2e (vitest) + coverage
    needs: [e2e, e2e-cp, mcp-conformance, playwright-e2e, playwright-real-prometheus, typecheck, playwright-cp-dashboard]
    # A skipped required check counts as satisfied, so this must still run
    # when the matrix fails — otherwise the gate would vanish exactly when
    # it matters.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: assert every serving mode passed
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::e2e matrix result: ${{ needs.e2e.result }}"
            exit 1
          fi
      - name: assert the cross-plane suite passed in every serving mode
        run: |
          if [ "${{ needs.e2e-cp.result }}" != "success" ]; then
            echo "::error::e2e control plane result: ${{ needs.e2e-cp.result }}"
            exit 1
          fi
      - name: assert MCP conformance passed
        # Folded into this required aggregate so the official-suite gate is
        # merge-blocking without renaming the branch-protection contexts.
        run: |
          if [ "${{ needs.mcp-conformance.result }}" != "success" ]; then
            echo "::error::mcp conformance result: ${{ needs.mcp-conformance.result }}"
            exit 1
          fi
      - name: assert the Playwright suites passed
        # Folded in for the same reason as MCP conformance: a suite that
        # runs but gates nothing is a check no one has to satisfy, and the
        # money contracts it covers are where nearly every billing
        # regression has been caught. Dropping it back to advisory is
        # removing it from `needs` and deleting this step.
        run: |
          if [ "${{ needs.playwright-e2e.result }}" != "success" ]; then
            echo "::error::playwright e2e result: ${{ needs.playwright-e2e.result }}"
            exit 1
          fi
      - name: assert the money suite passed against a real Prometheus
        run: |
          if [ "${{ needs.playwright-real-prometheus.result }}" != "success" ]; then
            echo "::error::real-prometheus money e2e result: ${{ needs.playwright-real-prometheus.result }}"
            exit 1
          fi
      - name: assert the TypeScript projects typecheck
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::typecheck result: ${{ needs.typecheck.result }}"
            exit 1
          fi
      - name: assert the Dashboard Playwright suite passed
        run: |
          if [ "${{ needs.playwright-cp-dashboard.result }}" != "success" ]; then
            echo "::error::dashboard playwright result: ${{ needs.playwright-cp-dashboard.result }}"
            exit 1
          fi

  # The control plane's Dashboard (web-cp/) against the real stack:
  # Postgres, kine, the control plane and a managed gateway, started per spec
  # file by scripts/cp-dev-stack.mjs, with the built dist/ served through
  # `vite preview`. The only stand-in is the upstream provider. It uploads
  # no coverage artifact.
  playwright-cp-dashboard:
    name: e2e (playwright, control-plane dashboard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # The same image and digest as rust-unit's control-plane database.
      # Each stack creates and drops two databases of its own on it.
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The control plane's build.rs generates the etcd front from protos.
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-cp/package-lock.json
      # The browser build is pinned by @playwright/test in the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('web-cp/package-lock.json') }}
      - name: fetch kine
        run: |
          scripts/fetch-kine.sh "$RUNNER_TEMP/kine"
          echo "CP_E2E_KINE_BIN=$RUNNER_TEMP/kine" >> "$GITHUB_ENV"
      - name: require psql
        # cp-dev-stack.mjs creates and drops its databases with psql.
        run: psql --version
      - name: build the gateway and the control plane
        # Each binary named: `--bin` filters every selected package.
        run: cargo build -p aisix-server --bin aisix -p aisix-control-plane --bin aisix-control-plane
      - name: dashboard UI e2e
        working-directory: web-cp
        env:
          CP_E2E_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test

  # The Playwright suites had no automated gate: nothing in this workflow
  # touched `web/` or `web-portal/`, so the money contracts (what each
  # endpoint charges, on which side of the ledger, and when a ceiling
  # refuses) were only ever checked when someone ran them by hand. Those
  # suites are where nearly every billing regression has been caught.
  playwright-e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The money fixture runs the RELEASE gateway and the DEBUG portal, and
      # refuses to run against a binary older than its sources — so both
      # profiles are built here rather than assumed. The console suite runs
      # the release console + portal + gateway (`aisix validate`).
      - name: build the binaries the suites drive
        run: |
          cargo build --release -p aisix-server -p aisix-portal -p aisix-console
          cargo build -p aisix-portal
      # Browser-free and the fastest of the three, so it runs first: it
      # spawns real processes and asserts over `/metrics` with `fetch`.
      - name: money e2e (no browser)
        working-directory: web-portal
        run: |
          npm ci
          npx playwright test money.spec.ts
      # Chromium is installed from each project so each gets the build its
      # own pinned `@playwright/test` expects.
      #
      # `dist/` must be the ROOT-path build: the deployed portal is served
      # under `/portal/`, and its fixture rejects a `/portal/`-based bundle.
      - name: portal UI e2e
        working-directory: web-portal
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test portal.spec.ts
      # The console fixture serves `dist/` through `vite preview`, so this
      # exercises the artifact that ships rather than a dev server.
      - name: console UI e2e
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test

  # The money suite above answers the portal's billing query with a PromQL
  # stand-in that reimplements `resets()`, `offset`, `or` and `and on()` with
  # regexes, so a wrong query string still passes it — the original "billed $0
  # of $5" bug hid behind a stand-in exactly that way. This runs the money path
  # against a real, pinned Prometheus scraping the e2e gateway, so the query
  # text and Prometheus' own evaluation of it are what the assertions measure.
  playwright-real-prometheus:
    name: e2e (playwright, real prometheus)
    runs-on: ubuntu-latest
    # Two cargo builds plus the suite: bounded so a hung step fails the gate
    # instead of holding a runner for the 6-hour default.
    timeout-minutes: 45
    # Executes a downloaded third-party binary: keep the token read-only and
    # out of the checkout's git config, as mcp-conformance does.
    permissions:
      contents: read
    env:
      PROMETHEUS_VERSION: "2.53.4"
      # sha256 of prometheus-2.53.4.linux-amd64.tar.gz, taken from that
      # release's sha256sums.txt. Pinned here rather than fetched beside the
      # tarball: a checksum downloaded from the same place as the file only
      # proves the download finished.
      PROMETHEUS_SHA256: b8b497c4610d1b93208252b60c8f20f6b2e78596ae8df43397a2e805aa53d475
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install prometheus ${{ env.PROMETHEUS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          dest="${RUNNER_TEMP}/prometheus"
          mkdir -p "${dest}"
          # Same release CDN as protoc, with the same intermittent 504s — see
          # .github/actions/setup-protoc.
          for attempt in 1 2 3 4 5; do
            # --max-time bounds a transfer that connects and then stalls.
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
                --max-time 300 -o "${dest}/prometheus.tar.gz" "${url}"; then
              break
            fi
            if [ "${attempt}" = 5 ]; then
              echo "::error::prometheus ${PROMETHEUS_VERSION} download failed after 5 attempts"
              exit 1
            fi
            sleep 15
          done
          echo "${PROMETHEUS_SHA256}  ${dest}/prometheus.tar.gz" | sha256sum -c -
          tar -xzf "${dest}/prometheus.tar.gz" -C "${dest}" --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus"
          "${dest}/prometheus" --version
          # Read by the fixture, which fails (never skips) when it is unset.
          echo "PROMETHEUS_BIN=${dest}/prometheus" >> "${GITHUB_ENV}"
      # Same binaries as the stand-in money suite: the RELEASE gateway and the
      # DEBUG portal, which the fixture refuses to run if older than sources.
      - name: build the binaries the suite drives
        run: |
          cargo build --release -p aisix-server
          cargo build -p aisix-portal
      - name: money e2e against real prometheus (no browser)
        working-directory: web-portal
        run: |
          npm ci
          npx playwright test money-real-prometheus.spec.ts

  mcp-conformance:
    # The OFFICIAL MCP conformance suite against the shipped /mcp chain
    # (scoped gateway + bridge + in-process upstream). Scenario list and
    # deliberate exclusions live in scripts/mcp-conformance.sh; the suite
    # and its transitive graph are pinned by tools/mcp-conformance/
    # package-lock.json; needs Node >= 22 (fs.globSync). Merge-blocking
    # through the e2e-gate aggregate below.
    name: mcp conformance (official suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job executes third-party code (npm ci + cargo build scripts):
    # keep the token read-only and out of the checkout's git config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: build the conformance target
        run: cargo build -p aisix-mcp --example conformance_server
      - name: run the applicable server scenarios
        run: bash scripts/mcp-conformance.sh

  coverage-gate:
    name: coverage >= 90%
    needs: [rust-unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: coverage-unit, path: cov/unit }
      - uses: actions/download-artifact@v8
        with: { pattern: coverage-e2e-*, path: cov/e2e, merge-multiple: true }
      - name: merge + threshold
        run: |
          npm i -g lcov-result-merger @lcov-viewer/cli
          merged=cov/combined.info
          shopt -s nullglob
          unit=(cov/unit/*.info)
          e2e=(cov/e2e/*.info)
          if [ "${#unit[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Rust unit coverage report, found ${#unit[@]}"
            exit 1
          fi
          # One report per e2e job: two serving modes times four shards.
          if [ "${#e2e[@]}" -ne 8 ]; then
            echo "::error::Expected 8 Rust e2e coverage reports, found ${#e2e[@]}"
            exit 1
          fi
          # lcov-result-merger accepts one input glob followed by one output
          # path. The exact-count checks above ensure this glob resolves to
          # precisely the unit report and every shard's report in both modes.
          lcov-result-merger 'cov/{unit,e2e}/*.info' "$merged"
          test -s "$merged" || {
            echo "::error::Coverage merger produced an empty report"
            exit 1
          }
          pct=$(awk -F: '/^LF:/ {tot+=$2} /^LH:/ {hit+=$2} END {if (tot>0) printf "%.2f", hit/tot*100; else print 0}' "$merged")
          echo "Combined line coverage: ${pct}%"
          threshold=${COVERAGE_THRESHOLD:-90}
          awk -v p="$pct" -v t="$threshold" 'BEGIN { exit (p+0 < t+0) }' || {
            echo "::error::Coverage ${pct}% below threshold ${threshold}%"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: cov/combined.info
          retention-days: 7
