<style>
:root{
  --ground:#E8EAE6; --surface:#F4F5F2; --raise:#FBFCFA;
  --ink:#161B19; --ink-2:#3D4642; --muted:#69736D; --line:#CFD5CE;
  --accent:#0E5563; --accent-ink:#FFFFFF; --accent-soft:#D6E5E7;
  --ok:#3F7D4E; --warn:#A8760F; --crit:#A81B4A;
  --ok-soft:#DCE9DD; --warn-soft:#F2E6CB; --crit-soft:#F3D8E0;
  --track:#D8DDD7;
  --r:4px; --pad:20px;
  --display:"Fraunces",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131816; --surface:#1C2320; --raise:#232B27;
    --ink:#E6E9E4; --ink-2:#BAC3BD; --muted:#8A948E; --line:#333D38;
    --accent:#4FB3C4; --accent-ink:#0B1618; --accent-soft:#1D3A3F;
    --ok:#69B478; --warn:#D9A63F; --crit:#E4708F;
    --ok-soft:#1D2E22; --warn-soft:#332A16; --crit-soft:#331C25;
    --track:#2A332E;
  }
}
:root[data-theme="dark"]{
  --ground:#131816; --surface:#1C2320; --raise:#232B27;
  --ink:#E6E9E4; --ink-2:#BAC3BD; --muted:#8A948E; --line:#333D38;
  --accent:#4FB3C4; --accent-ink:#0B1618; --accent-soft:#1D3A3F;
  --ok:#69B478; --warn:#D9A63F; --crit:#E4708F;
  --ok-soft:#1D2E22; --warn-soft:#332A16; --crit-soft:#331C25;
  --track:#2A332E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 外壳：仪表间的“铭牌 + 面板”骨架 ───────────────────────── */
.shell{max-width:1180px;margin:0 auto;padding:0 24px 72px}
header.plate{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding:26px 0 18px;border-bottom:2px solid var(--ink)}
header.plate h1{font-size:22px;letter-spacing:-.01em}
.plate .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.plate .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

nav.tabs{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--line);
  overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:11px 14px;cursor:pointer;color:var(--muted);white-space:nowrap;
  font-size:13px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);margin-bottom:16px}
.panel > h2{font-size:15px;margin-bottom:4px}
.panel > .hint{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* ── 读数：仪表盘上的大数字 ────────────────────────────────── */
.read{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.read .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.read .val{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:27px;font-weight:500;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.read .foot{font-size:11.5px;color:var(--muted);margin-top:5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:500;
  padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}

.bar{height:5px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;background:var(--accent)}

button.act{background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:var(--r);padding:8px 15px;cursor:pointer;font-weight:500;font-size:13px}
button.act:hover{filter:brightness(1.1)}
button.act:disabled{opacity:.5;cursor:default}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:12.5px}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=number],select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raise)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:11px 14px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;margin:14px 0}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note code,code{font-family:var(--mono);font-size:12px}
pre{font-family:var(--mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;overflow-x:auto;margin:0}

/* ── 登录闸 ───────────────────────────────────────────────── */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
#gate .box{width:100%;max-width:355px}
#gate .box h1{font-size:20px;margin-bottom:3px}
#gate .box p{color:var(--muted);font-size:12.5px;margin:0 0 20px}
[hidden]{display:none !important}

@media (max-width:640px){
  .shell{padding:0 16px 56px}
  .read .val{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<!-- 登录闸：控制台能改网关配置、能看到明文上游密钥，所以未登录不渲染任何数据。 -->
<div id="gate">
  <div class="box panel">
    <h1>Gateway Meter Room</h1>
    <p>aigw.to · AISIX 网关控制台</p>
    <form id="loginForm">
      <!-- 单口令登录：给密码管理器一个可锚定的用户名字段，
           否则浏览器会警告，且凭据存不进去。 -->
      <input type="text" name="username" value="aigw.to" autocomplete="username"
             readonly hidden aria-hidden="true" tabindex="-1">
      <label class="f"><span>口令</span>
        <input type="password" id="pw" autocomplete="current-password" required autofocus>
      </label>
      <button class="act" style="width:100%" type="submit">进入</button>
    </form>
    <div id="loginErr" class="note crit" hidden></div>
  </div>
</div>

<div id="app" class="shell" hidden>
  <header class="plate">
    <h1>Gateway Meter Room</h1>
    <span class="sub">aigw.to</span>
    <span class="spacer"></span>
    <span class="pill" id="healthPill"><span class="dot"></span><span id="healthTxt">检查中</span></span>
    <button class="ghost" id="themeBtn" title="切换主题">主题</button>
    <button class="ghost" id="logoutBtn">登出</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">概览</button>
    <button role="tab" data-tab="usage" aria-selected="false">用量</button>
    <button role="tab" data-tab="providers" aria-selected="false">供应商</button>
    <button role="tab" data-tab="models" aria-selected="false">模型与定价</button>
    <button role="tab" data-tab="keys" aria-selected="false">调用方密钥</button>
    <button role="tab" data-tab="raw" aria-selected="false">配置原文</button>
  </nav>

  <section id="tab-overview"></section>
  <section id="tab-usage" hidden></section>
  <section id="tab-providers" hidden></section>
  <section id="tab-models" hidden></section>
  <section id="tab-keys" hidden></section>
  <section id="tab-raw" hidden></section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ── 数字格式：仪表读数要一眼可读，不要 12345678 ──────────────
const fmtInt = n => (n ?? 0).toLocaleString("en-US", {maximumFractionDigits:0});
function fmtCompact(n){
  n = Number(n) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "k";
  return fmtInt(n);
}
// 花费以 micro-USD 计数，除回美元。
// 精度随量级走：LLM 单次调用常在千分之一美元量级，固定 2 位小数会把
// 真实花费显示成 $0.00 —— 那和「没有花费」在界面上无法区分。
function fmtUsd(micro){
  const usd = (Number(micro)||0)/1e6;
  if (usd === 0) return "$0";
  if (usd < 0.01) return "$" + usd.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  if (usd < 1)    return "$" + usd.toFixed(4);
  return "$" + usd.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function api(path, opts={}){
  const r = await fetch(path, {credentials:"same-origin", ...opts});
  if (r.status === 401){ showGate(); throw new Error("未登录"); }
  return r;
}
async function prom(query, range_hours){
  const r = await api("/api/metrics", {method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({query, range_hours})});
  const j = await r.json();
  if (j.status !== "success") throw new Error(j.error || "查询失败");
  return j.data.result;
}
/** 瞬时查询 -> [{labels, value}]，按值降序。 */
async function promTop(query){
  const rows = (await prom(query)).map(r => ({l:r.metric, v:Number(r.value[1])||0}));
  rows.sort((a,b) => b.v - a.v);
  return rows;
}

// ── 登录 ────────────────────────────────────────────────────
function showGate(){ $("#gate").hidden = false; $("#app").hidden = true; }
function showApp(){ $("#gate").hidden = true; $("#app").hidden = false; }

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#loginErr"); err.hidden = true;
  const r = await fetch("/api/login", {method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({password: $("#pw").value})});
  if (r.ok){ $("#pw").value = ""; showApp(); boot(); }
  else { err.textContent = (await r.json()).error || "登录失败"; err.hidden = false; }
});
$("#logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", {method:"POST"}); location.reload();
});
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("aisix-theme", next); } catch(_){}
});
try { const t = localStorage.getItem("aisix-theme");
  if (t) document.documentElement.setAttribute("data-theme", t); } catch(_){}

// ── 标签页 ──────────────────────────────────────────────────
const TABS = ["overview","usage","providers","models","keys","raw"];
document.querySelectorAll("nav.tabs button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button")
      .forEach(x => x.setAttribute("aria-selected", String(x === b)));
    TABS.forEach(t => $("#tab-"+t).hidden = (t !== b.dataset.tab));
    render(b.dataset.tab);
  });
});

let RES = null;   // 管理 API 的资源快照
let DOC = null;   // resources.yaml 的可编辑文档

async function boot(){
  await loadResources();
  render("overview");
}

async function loadResources(){
  const [r1, r2] = await Promise.all([
    api("/api/resources").then(r => r.json()),
    api("/api/file").then(r => r.json()),
  ]);
  RES = r1; DOC = r2.doc || {_format_version:"1"};
  const st = RES.model_status;
  const healthy = st && !st.error;
  $("#healthPill").className = "pill " + (healthy ? "ok" : "crit");
  $("#healthTxt").textContent = healthy ? "网关在线" : "网关不可达";
}

/** 管理 API 每条是 {id, revision, value:{...}} 信封，拆平成 {id, ...字段}。
 *  不拆的话 k.display_name 恒为 undefined，界面会安静地退化成显示裸 id。 */
function listOf(v){
  const arr = Array.isArray(v) ? v : (v && Array.isArray(v.items) ? v.items : []);
  return arr.map(e => (e && typeof e === "object" && e.value && typeof e.value === "object")
    ? {id: e.id, revision: e.revision, ...e.value} : e);
}

function render(tab){
  if (tab === "overview")  return renderOverview();
  if (tab === "usage")     return renderUsage();
  if (tab === "providers") return renderProviders();
  if (tab === "models")    return renderModels();
  if (tab === "keys")      return renderKeys();
  if (tab === "raw")       return renderRaw();
}

// ── 概览 ────────────────────────────────────────────────────
async function renderOverview(){
  const el = $("#tab-overview");
  const models = listOf(RES.models), keys = listOf(RES.api_keys), pks = listOf(RES.provider_keys);
  el.innerHTML = `
    <div class="panel">
      <h2>网关读数</h2>
      <p class="hint">累计值来自 Prometheus，自开始抓取起算。</p>
      <div class="grid g3">
        <div class="read"><div class="lab">请求总数</div><div class="val num" id="oReq">…</div>
          <div class="foot">经 LLM 端点</div></div>
        <div class="read"><div class="lab">Token 总量</div><div class="val num" id="oTok">…</div>
          <div class="foot">输入 + 输出（含缓存）</div></div>
        <div class="read"><div class="lab">累计花费</div><div class="val num" id="oSpend">…</div>
          <div class="foot">按模型定价折算</div></div>
        <div class="read"><div class="lab">已配置</div>
          <div class="val num">${models.length} / ${pks.length} / ${keys.length}</div>
          <div class="foot">模型 / 供应商 / 调用方密钥</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>近 24 小时请求</h2>
      <p class="hint">按端点分。没有曲线说明该时段没有流量。</p>
      <div id="oChart">读取中…</div>
    </div>`;

  try {
    const [req, tok, spend] = await Promise.all([
      promTop("sum(aisix_llm_requests_total)"),
      promTop("sum(aisix_llm_total_tokens_total)"),
      promTop("sum(aisix_llm_spend_micro_usd_total)"),
    ]);
    $("#oReq").textContent   = req.length   ? fmtCompact(req[0].v)   : "0";
    $("#oTok").textContent   = tok.length   ? fmtCompact(tok[0].v)   : "0";
    $("#oSpend").textContent = spend.length ? fmtUsd(spend[0].v)     : "$0.00";
  } catch(e){
    ["#oReq","#oTok","#oSpend"].forEach(s => $(s).textContent = "—");
  }
  try {
    const series = await prom('sum by (endpoint) (rate(aisix_llm_requests_total[10m]))', 24);
    $("#oChart").innerHTML = series.length
      ? multiLine(series, v => v.toFixed(3) + " req/s")
      : `<p class="hint">该时段没有 LLM 请求。</p>`;
  } catch(e){ $("#oChart").innerHTML = `<div class="note crit">曲线读取失败：${esc(e.message)}</div>`; }
}

// ── 用量 ────────────────────────────────────────────────────
async function renderUsage(){
  const el = $("#tab-usage");
  el.innerHTML = `
    <div class="panel">
      <h2>按调用方密钥</h2>
      <p class="hint">指标只带 <code>api_key_id</code>，名称由控制台对照配置补上。</p>
      <div class="scroll"><table id="uKeys"><thead><tr>
        <th>密钥</th><th class="r">请求</th><th class="r">Token</th><th class="r">花费</th>
      </tr></thead><tbody><tr><td colspan="4">读取中…</td></tr></tbody></table></div>
    </div>
    <div class="panel">
      <h2>按模型</h2>
      <div class="scroll"><table id="uModels"><thead><tr>
        <th>模型</th><th>供应商</th><th class="r">请求</th><th class="r">Token</th><th class="r">花费</th>
      </tr></thead><tbody><tr><td colspan="5">读取中…</td></tr></tbody></table></div>
    </div>
    <div class="panel">
      <h2>近 24 小时 Token 速率</h2>
      <div id="uChart">读取中…</div>
    </div>`;

  // api_key_id -> 显示名。两跳：指标只有 id；管理 API 有 id 和 key_hash，
  // 但没有名字——文件模式下 display_name 是「文件侧身份」，校验前就被剥离
  // （见上游 filesource/desugar.rs 的说明），所以名字只存在于 resources.yaml。
  // key_hash 是两边都有的字段，用它把两侧接起来。
  const hashToName = {};
  (DOC.api_keys || []).forEach(k => { if (k.key_hash) hashToName[k.key_hash] = k.display_name; });
  const keyName = {};
  listOf(RES.api_keys).forEach(k => {
    if (k.id && k.key_hash && hashToName[k.key_hash]) keyName[k.id] = hashToName[k.key_hash];
  });

  try {
    const [req, tok, spend] = await Promise.all([
      promTop("sum by (api_key_id) (aisix_llm_requests_total)"),
      promTop("sum by (api_key_id) (aisix_llm_total_tokens_total)"),
      promTop("sum by (api_key_id) (aisix_llm_spend_micro_usd_total)"),
    ]);
    const by = {};
    const put = (rows, f) => rows.forEach(r => {
      const id = r.l.api_key_id || "(未知)";
      (by[id] = by[id] || {req:0,tok:0,spend:0})[f] = r.v;
    });
    put(req,"req"); put(tok,"tok"); put(spend,"spend");
    const rows = Object.entries(by).sort((a,b) => b[1].tok - a[1].tok);
    const max = Math.max(1, ...rows.map(r => r[1].tok));
    $("#uKeys tbody").innerHTML = rows.length ? rows.map(([id,v]) => `
      <tr><td><strong>${esc(keyName[id] || "（未命名）")}</strong>
        <div class="bar"><i style="width:${(v.tok/max*100).toFixed(1)}%"></i></div>
        <div class="foot num" style="font-size:11px;color:var(--muted)">${esc(id)}</div></td>
      <td class="r num">${fmtInt(v.req)}</td>
      <td class="r num">${fmtCompact(v.tok)}</td>
      <td class="r num">${fmtUsd(v.spend)}</td></tr>`).join("")
      : `<tr><td colspan="4" style="color:var(--muted)">尚无用量数据。</td></tr>`;
  } catch(e){
    $("#uKeys tbody").innerHTML = `<tr><td colspan="4">读取失败：${esc(e.message)}</td></tr>`;
  }

  try {
    const [req, tok, spend] = await Promise.all([
      promTop("sum by (model, provider) (aisix_llm_requests_total)"),
      promTop("sum by (model, provider) (aisix_llm_total_tokens_total)"),
      promTop("sum by (model, provider) (aisix_llm_spend_micro_usd_total)"),
    ]);
    const by = {};
    const put = (rows, f) => rows.forEach(r => {
      const k = (r.l.model||"?") + "␀" + (r.l.provider||"?");
      (by[k] = by[k] || {req:0,tok:0,spend:0})[f] = r.v;
    });
    put(req,"req"); put(tok,"tok"); put(spend,"spend");
    const rows = Object.entries(by).sort((a,b) => b[1].tok - a[1].tok);
    $("#uModels tbody").innerHTML = rows.length ? rows.map(([k,v]) => {
      const [m,p] = k.split("␀");
      return `<tr><td><strong>${esc(m)}</strong></td><td>${esc(p)}</td>
        <td class="r num">${fmtInt(v.req)}</td><td class="r num">${fmtCompact(v.tok)}</td>
        <td class="r num">${fmtUsd(v.spend)}</td></tr>`;
    }).join("") : `<tr><td colspan="5" style="color:var(--muted)">尚无用量数据。</td></tr>`;
  } catch(e){
    $("#uModels tbody").innerHTML = `<tr><td colspan="5">读取失败：${esc(e.message)}</td></tr>`;
  }

  try {
    const s = await prom('sum by (model) (rate(aisix_llm_total_tokens_total[10m]))', 24);
    $("#uChart").innerHTML = s.length ? multiLine(s, v => v.toFixed(1) + " tok/s")
      : `<p class="hint">该时段没有 token 流量。</p>`;
  } catch(e){ $("#uChart").innerHTML = `<div class="note crit">${esc(e.message)}</div>`; }
}

/** 多序列折线图。手绘 SVG——外部图表库既加载不进来也不值得。 */
function multiLine(series, fmt){
  const W = 880, H = 190, PL = 54, PB = 22, PT = 10, PR = 8;
  let tMin = Infinity, tMax = -Infinity, vMax = 0;
  series.forEach(s => s.values.forEach(([t,v]) => {
    t = Number(t); v = Number(v) || 0;
    if (t < tMin) tMin = t; if (t > tMax) tMax = t; if (v > vMax) vMax = v;
  }));
  if (!isFinite(tMin) || vMax <= 0) return `<p class="hint">该时段全部为零。</p>`;
  const x = t => PL + (Number(t)-tMin)/Math.max(1,(tMax-tMin)) * (W-PL-PR);
  const y = v => PT + (1 - (Number(v)||0)/vMax) * (H-PT-PB);
  const hues = ["var(--accent)","var(--ok)","var(--warn)","var(--crit)","var(--ink-2)"];
  const paths = series.slice(0,5).map((s,i) => {
    const d = s.values.map(([t,v],j) => (j?"L":"M") + x(t).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${hues[i%5]}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  const grid = [0,.5,1].map(f => {
    const yy = PT + f*(H-PT-PB);
    return `<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>
      <text x="${PL-7}" y="${yy+4}" text-anchor="end" font-size="10"
        font-family="var(--mono)" fill="var(--muted)">${esc(fmt(vMax*(1-f)))}</text>`;
  }).join("");
  const legend = series.slice(0,5).map((s,i) => {
    const name = Object.values(s.metric)[0] || "(全部)";
    return `<span class="pill" style="border-color:transparent">
      <span class="dot" style="background:${hues[i%5]}"></span>${esc(name)}</span>`;
  }).join(" ");
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
    role="img" aria-label="时间序列">${grid}${paths}</svg></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${legend}</div>`;
}

async function addProvider(){

  DOC.provider_keys = DOC.provider_keys || []; DOC.provider_keys.push(item);

}

async function addModel(){

    model_name:up, provider_key:$("#mPk").value};

  if (!isNaN(i) && !isNaN(o)) item.cost = {input_per_1k:i, output_per_1k:o};
  DOC.models = DOC.models || []; DOC.models.push(item);
  await saveDoc("#mMsg", "models");
}

const fmtRl = rl => !rl ? "不限" :
  Object.entries(rl).filter(([,v]) => v != null).map(([k,v]) => `${k}=${v}`).join(" ") || "不限";

async function mintKey(){
  const name = $("#kName").value.trim();
  if (!name) return msg("#kMsg","名称不能为空","crit");
  const r = await api("/api/mint-key", {method:"POST"});
  const {plaintext, key_hash} = await r.json();
  const item = {display_name:name, key_hash,
    allowed_models: $("#kModels").value.split(",").map(s=>s.trim()).filter(Boolean)};
  const rpm = parseInt($("#kRpm").value), tpm = parseInt($("#kTpm").value);
  const rl = {}; if (rpm>0) rl.rpm = rpm; if (tpm>0) rl.tpm = tpm;
  if (Object.keys(rl).length) item.rate_limit = rl;
  DOC.api_keys = DOC.api_keys || []; DOC.api_keys.push(item);
  const ok = await saveDoc("#kMsg", null);
  if (ok) $("#kMsg").innerHTML = `<div class="note"><strong>密钥已生成——明文只显示这一次：</strong>
    <pre style="margin-top:8px">${esc(plaintext)}</pre></div>` + $("#kMsg").innerHTML;
  else renderKeys();
}

// ── 写入 ────────────────────────────────────────────────────
function msg(sel, text, kind){
  $(sel).innerHTML = `<div class="note ${kind||""}">${esc(text)}</div>`;
  return false;
}
async function delItem(kind, i){
  if (!confirm("确认删除？会立即重写配置并重载网关。")) return;
  DOC[kind].splice(i,1);
  await saveDoc(null, kind === "provider_keys" ? "providers"
    : kind === "api_keys" ? "keys" : "models");
}
async function saveDoc(msgSel, rerenderTab){
  DOC._format_version = DOC._format_version || "1";
  const r = await api("/api/file", {method:"PUT",
    headers:{"content-type":"application/json"}, body: JSON.stringify({doc: DOC})});
  const j = await r.json();
  if (!r.ok){
    if (msgSel) msg(msgSel, j.error || "保存失败", "crit"); else alert(j.error||"保存失败");
    await loadResources();          // 回滚到盘上的真实状态
    if (rerenderTab) render(rerenderTab);
    return false;
  }
  await loadResources();
  if (rerenderTab) render(rerenderTab);
  if (msgSel) msg(msgSel, "已保存，网关已重载。", "");
  return true;
}

// 启动：先问会话状态，避免刷新后闪一下登录页。
fetch("/api/session").then(r=>r.json()).then(j => {
  if (j.authed){ showApp(); boot(); } else showGate();
}).catch(showGate);
